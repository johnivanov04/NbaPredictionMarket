[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-prediction-market"
version = "0.1.0"
description = "Phase 1: trustworthy NBA game + Kalshi market data ingestion foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=15",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "tenacity>=8.2",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
nba-pm-build = "nba_prediction_market.pipelines.build_dataset:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits live APIs; deselected by default",
    "dataset: asserts invariants of the generated data/ artefacts; deselected by default",
]
addopts = "-m 'not integration and not dataset'"

[tool.coverage.run]
source = ["nba_prediction_market"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
